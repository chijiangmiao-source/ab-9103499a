# High-altitude probe calibration package release system.
#
# Host port is configurable:
#   CONTROL_HTTP_PORT=9000 docker compose up verify
services:
  registry-a:
    build:
      context: ./app
    command: ["python", "/app/lib/registry_server.py"]
    environment:
      REGISTRY_NAME: registry-a
      REGISTRY_PORT: "8080"
      REGISTRY_DATA_DIR: /data/registry-a
      OP_KEY_SECRET: ${OP_KEY_SECRET:-probe-calibration-master-secret}
    volumes:
      - rega-data:/data/registry-a
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  registry-b:
    build:
      context: ./app
    command: ["python", "/app/lib/registry_server.py"]
    environment:
      REGISTRY_NAME: registry-b
      REGISTRY_PORT: "8080"
      REGISTRY_DATA_DIR: /data/registry-b
      OP_KEY_SECRET: ${OP_KEY_SECRET:-probe-calibration-master-secret}
    volumes:
      - regb-data:/data/registry-b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  controller:
    build:
      context: ./app
    command: ["python", "/app/lib/controller_server.py"]
    environment:
      CONTROL_PORT: "8000"
      CONTROLLER_DATA_DIR: /data/controller
      REGISTRY_A_URL: http://registry-a:8080
      REGISTRY_B_URL: http://registry-b:8080
      OP_KEY_SECRET: ${OP_KEY_SECRET:-probe-calibration-master-secret}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-verify-admin-token}
    ports:
      # Configurable host port; default 8000.
      - "${CONTROL_HTTP_PORT:-8000}:8000"
    volumes:
      - controller-data:/data/controller
    depends_on:
      registry-a:
        condition: service_healthy
      registry-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
    # The verify scenario kills the controller via the admin endpoint; the
    # policy restarts it so persistence/receipt-based convergence is proven.
    restart: unless-stopped

  # One-shot acceptance service: runs checks and exits with the result code.
  verify:
    build:
      context: ./app
    command: ["/app/verify/entrypoint.sh"]
    environment:
      CONTROLLER_URL: http://controller:8000
      REGISTRY_A_URL: http://registry-a:8080
      REGISTRY_B_URL: http://registry-b:8080
      OP_KEY_SECRET: ${OP_KEY_SECRET:-probe-calibration-master-secret}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-verify-admin-token}
    depends_on:
      controller:
        condition: service_healthy
      registry-a:
        condition: service_healthy
      registry-b:
        condition: service_healthy
    restart: "no"

volumes:
  controller-data:
  rega-data:
  regb-data:
